name: Product feedback / feature idea
description: Share feedback or a feature idea for the public stable Vibe Monitor client. This is a PUBLIC issue — do not share private data.
title: "[Feedback] Vibe Monitor"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Vibe Monitor is available as an open-source stable client. You can install it from the official npm latest release; this issue is for general feedback, not access codes.

        **This GitHub issue is public. Never include your email address, source code, repository URLs, passwords, enterprise network details, activation codes or other secrets.**
        No private project or contact information is needed to submit feedback.
  - type: dropdown
    id: agent
    attributes:
      label: Which coding agent do you use?
      options:
        - Codex
        - Claude Code
        - Cursor
        - Antigravity
        - TRAE
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Primary operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What do you want to learn from your project's architecture?
      description: Keep this general and non-sensitive. No links or identifying project details are necessary.
      placeholder: "For example: understand coupling before adding more AI-generated features."
    validations:
      required: false
