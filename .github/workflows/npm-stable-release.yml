name: Vibe Monitor official npm release (single client)
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Approved stable semver (e.g. 1.0.1)
        required: true
        type: string
      expected_sha:
        description: Exact reviewed public main commit SHA
        required: true
        type: string
      approval_ticket:
        description: Documented owner approval reference
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: vibe-monitor-stable-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stable-npm-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fail closed without exact SHA, version, or approved release gates
        env:
          VERSION: ${{ inputs.expected_version }}
          COMMIT_SHA: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval_ticket }}
          OWNER_APPROVED: ${{ vars.VIBE_STABLE_RELEASE_APPROVED }}
          PRIVACY_APPROVED: ${{ vars.VIBE_PRIVACY_APPROVED }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          if(process.env.COMMIT_SHA!==process.env.GITHUB_SHA||
             !/^[a-f0-9]{40}$/.test(process.env.COMMIT_SHA||'')||
             !/^\d+\.\d+\.\d+$/.test(process.env.VERSION||'')||
             p.version!==process.env.VERSION||p.private!==false||
             p.name!=='@vibe-monitor/setup'||p.license!=='Apache-2.0')
            throw Error('not_audited_stable_source');
          if(!/^[A-Za-z0-9_-]{8,120}$/.test(process.env.APPROVAL||''))
            throw Error('owner_approval_missing');
          for(const k of ['OWNER_APPROVED','PRIVACY_APPROVED'])
            if(process.env[k]!=='yes')throw Error('release_gate_missing:'+k);
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Verify production Cloud policy and public-client telemetry are live
        run: |
          node --input-type=module <<'JS'
          import {COMMUNITY_POLICY_URL, COMMUNITY_POLICY_KEY_ID, COMMUNITY_POLICY_NEXT_KEY_ID,
            COMMUNITY_POLICY_TRUSTED_PUBLIC_KEY_PEM, COMMUNITY_POLICY_TRUSTED_NEXT_PUBLIC_KEY_PEM,
            verifyCommunityPolicyEnvelope} from './src/community-cloud-policy.js';
          import {FREE_TELEMETRY_UPLOAD_ENABLED} from './src/cloud.js';
          if (!FREE_TELEMETRY_UPLOAD_ENABLED) throw Error('production_telemetry_ingress_not_enabled_in_client');
          if (!COMMUNITY_POLICY_TRUSTED_PUBLIC_KEY_PEM) throw Error('cloud_policy_trust_root_not_pinned');
          const r=await fetch(COMMUNITY_POLICY_URL,{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(8000)});
          if (r.status!==200) throw Error('production_cloud_policy_not_available');
          const n=Number(r.headers.get('content-length')||0);
          if(n>16384) throw Error('production_policy_too_large');
          const policy=await r.json();
          if(!verifyCommunityPolicyEnvelope(policy,{publicKeysById:{
            [COMMUNITY_POLICY_KEY_ID]:COMMUNITY_POLICY_TRUSTED_PUBLIC_KEY_PEM,
            [COMMUNITY_POLICY_NEXT_KEY_ID]:COMMUNITY_POLICY_TRUSTED_NEXT_PUBLIC_KEY_PEM
          }}))throw Error('production_cloud_policy_signature_invalid');
          // Non-persisting canary: authenticated ingress rejects empty batch at
          // the schema validator. A disabled gateway or missing secret cannot pass.
          const intake=await fetch('https://vibe-api.fde.fan/free/telemetry',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({events:[]}),redirect:'error',
            signal:AbortSignal.timeout(8000)
          });
          if(intake.status!==400)throw Error('production_telemetry_intake_unavailable:'+intake.status);
          const rejection=await intake.json();
          if(rejection.error!=='invalid_batch')throw Error('production_telemetry_intake_unverified');

          JS
      - name: Prepare reproducible npm package and SHA256
        run: |
          npm pack --json > .release-pack.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const [p]=JSON.parse(fs.readFileSync('.release-pack.json','utf8'));
          const actual=p.files.map(f=>f.path).sort();
          const allowed=['LICENSE','NOTICE','README.md','dist/vibe-monitor-scan-worker.mjs','dist/vibe-monitor.mjs','package.json'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(allowed))throw Error('npm_tarball_allowlist_mismatch');
          fs.writeFileSync('.release-tarball-name',p.filename);
          JS
          shasum -a 256 "$(cat .release-tarball-name)" > release.sha256
      - name: Refuse immutable version collision
        env:
          VERSION: ${{ inputs.expected_version }}
        run: |
          if npm view "@vibe-monitor/setup@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "Version exists; re-publication prohibited" >&2
            exit 1
          fi
      - run: npm install --global 'npm@^11.5.1'
      - name: Publish exact signed package (npm OIDC provenance)
        run: npm publish "$(cat .release-tarball-name)" --tag latest --access public --provenance
      - name: Verify stable npm dist-tag
        env:
          VERSION: ${{ inputs.expected_version }}
        run: test "$(npm view @vibe-monitor/setup dist-tags.latest --prefer-online)" = "$VERSION"
      - name: Create public GitHub Release from the same commit and npm package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          gh release create "v$VERSION" "$(cat .release-tarball-name)" release.sha256 --target "$GITHUB_SHA" --title "Vibe Monitor v$VERSION" --generate-notes
