name: Public Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-surface:
    name: Public repository boundary (Ubuntu)
    outputs:
      has_client: ${{ steps.detect-client.outputs.has_client }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check current public boundary and required disclosures
        run: python3 scripts/verify-public-surface.py
      - name: Verify public CI checks have no secret dependencies
        shell: bash
        run: |
          test ! -d website
          test ! -e .env
          test -f .github/ISSUE_TEMPLATE/beta-access.yml
      - id: detect-client
        name: Detect audited OSS client sources
        shell: bash
        run: |
          if [ -d src ]; then
            echo "has_client=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_client=false" >> "$GITHUB_OUTPUT"
          fi

  client-platforms:
    name: OSS client / ${{ matrix.os }} / Node 22
    needs: public-surface
    if: needs.public-surface.outputs.has_client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: node ./dist/vibe-monitor.mjs --help

# This matrix remains skipped until reviewed and licensed CLI/MCP src/ exists
# in the PUBLIC repo; app/Cloud files and private source are never copied here.
