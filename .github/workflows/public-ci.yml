name: Public Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-surface:
    name: Public repository boundary (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check current public boundary and required disclosures
        run: python3 scripts/verify-public-surface.py
      - name: Verify public CI checks have no secret dependencies
        shell: bash
        run: |
          test ! -d website
          test ! -e .env
          test -f .github/ISSUE_TEMPLATE/beta-access.yml
